# Any one external body. An STL is required.
# +x nose to tail, +y to the side, +z up. Flow is +x before angle of attack.
# Empty values are computed. A flag or an environment variable overrides the file.

PROFILE=body

# --- flight ---
AOA=0
SPEED=20
ALT_M=0

# --- geometry ---
STL=                  # required. Relative paths are from this file's directory.
UNITS=                # set this when the file units are ambiguous. m, mm, cm, in, or ft.
TARGET_SIZE_M=        # if set, unit auto-detect aims at this length

# --- reference (empty = frontal area, length along x, box center) ---
REF_AREA=
REF_LENGTH=
REF_X=
REF_Y=
REF_Z=

# --- mesh ---
QUALITY=
LAYERS=0
MAX_COMPUTE=medium    # light, medium, or heavy. Sets cell cap and (light only) MPI ranks.
# CELLCAP=            # optional override of the preset cell budget
TARGET_YPLUS=80

# --- solver ---
SOLVER=auto
ITERS=2000            # SIMPLE cap (controlDict endTime). Override: -i N or ITERS=500 ./foam.sh
TURB_INT=0.001
NPROCS=
WRITE_ON_EXIT=0

# --- output ---
OUT=                  # empty = body_cfd under this repo
