# Rocket profile. The built-in shape is an example (about 4 in / 0.102 m diameter,
# 1 m long, tangent ogive, 4 fins). It is not a Cobra CAD model. Lengths are metres.
# Empty values are computed. A flag or an environment variable overrides the file.

PROFILE=rocket

# --- flight ---
AOA=0
SPEED=30
ALT_M=0               # ISA altitude, 0 to 11000 m

# --- built-in rocket (ignored when STL is set) ---
BODY_D=0.1016         # diameter, m  (4 in)
BODY_L=0.80           # cylindrical body length, m, not including the nose
NOSE_L=0.20
NOSE=ogive            # ogive, cone, or elliptical
FIN_COUNT=4
FIN_ROOT=0.12         # root chord, m
FIN_TIP=0.06
FIN_SPAN=0.10         # radial span out from the tube, m
FIN_SWEEP=0.04        # leading-edge sweep, m, root to tip
FIN_X=                # root leading-edge x from the nose tip. Empty = trailing edge at the base.

# --- geometry ---
STL=                  # empty = built-in rocket. Otherwise a path, relative to this file.
UNITS=                # empty = auto, aiming at about NOSE_L+BODY_L (or TARGET_SIZE_M)
TARGET_SIZE_M=        # optional length used when guessing STL units

# --- reference (empty = body cross-section, Lref = diameter, moment center = mid-length) ---
REF_AREA=             # m^2. Empty = pi D^2 / 4. Fins are not included in D.
REF_LENGTH=           # Lref, m. Empty = diameter. -C sets this too.
REF_X=                # CG, m. Empty = geometric mid-length, and the report says so.
REF_Y=
REF_Z=

# --- mesh ---
QUALITY=
LAYERS=0
MAX_COMPUTE=medium    # light, medium, or heavy. Sets cell cap and (light only) MPI ranks.
# CELLCAP=            # optional override of the preset cell budget
TARGET_YPLUS=80

# --- solver ---
SOLVER=auto           # auto switches to rhoSimpleFoam above Mach 0.3, transonic on from 0.7
ITERS=2000            # SIMPLE cap. Override: -i N or ITERS=500 ./rocket-foam.sh
TURB_INT=0.001
NPROCS=
WRITE_ON_EXIT=0

# --- output ---
OUT=                  # empty = rocket_cfd under this repo
