# Plane profile. Angles in degrees, lengths in metres, speed in m/s.
# Empty values are computed. A flag or an environment variable overrides the file.

PROFILE=plane

# --- flight ---
AOA=4                 # angle of attack, degrees
SPEED=20              # airspeed, m/s
ALT_M=0               # ISA altitude, 0 to 11000 m

# --- geometry ---
STL=                  # empty = built-in RC plane. Otherwise a path, relative to this file.
SPAN_FT=3             # built-in wingspan, feet
UNITS=                # STL units: m, mm, cm, in, ft. Empty = auto, aiming at about 3 ft.
TARGET_SIZE_M=        # unused for the plane profile

# --- reference (empty = wing area, MAC, quarter-chord) ---
REF_AREA=             # m^2
REF_LENGTH=           # MAC, m. REF_CHORD is the same key.
REF_X=                # moment-reference x, m
REF_Y=
REF_Z=

# --- mesh ---
QUALITY=              # coarse, medium, fine, vfine. Empty = size for y+ ~ 80.
LAYERS=0              # prism layers. 0 = wall functions.
MAX_COMPUTE=medium    # light, medium, or heavy. Sets cell cap and (light only) MPI ranks.
# CELLCAP=            # optional override of the preset cell budget
TARGET_YPLUS=80

# --- solver ---
SOLVER=auto           # auto, simple, or rho. auto uses simpleFoam at Mach <= 0.3.
ITERS=2000            # SIMPLE cap. Override: -i N or ITERS=500 ./plane-foam.sh
TURB_INT=0.001        # freestream turbulence intensity
NPROCS=               # empty = all cores
WRITE_ON_EXIT=0       # 1 = Ctrl+C writes the current fields

# --- output ---
OUT=                  # empty = plane_cfd under this repo (see REPO_ROOT in cfd.config)
